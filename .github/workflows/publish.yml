name: publish-registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["plugins/**"]
concurrency:
  group: publish-registry
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.7.0"
      - name: Install the immutable Registry tool
        run: |
          mkdir -p "$RUNNER_TEMP/spec"
          curl -fsSL https://github.com/soksak-ai/soksak-spec/releases/download/v0.0.24/soksak-ai-plugin-spec-0.0.24.tgz -o "$RUNNER_TEMP/spec.tgz"
          echo "b68a8bbbcd4ba5696c8a9e847201ded8f5d609ce10287525735a3f83c20f9b3d  $RUNNER_TEMP/spec.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/spec.tgz" -C "$RUNNER_TEMP/spec" --strip-components=1
          test -z "$(find "$RUNNER_TEMP/spec" -type l -print -quit)"
      - name: Derive the deterministic Registry identity
        id: identity
        run: |
          sequence=
          maximum=10
          while read -r tag; do
            [[ "$tag" =~ ^registry-([0-9]+)$ ]] || continue
            number=${BASH_REMATCH[1]}
            test "$number" -gt "$maximum" && maximum=$number
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
            test "$sha" = "$GITHUB_SHA" && sequence=$number
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          test -n "$sequence" || sequence=$((maximum + 1))
          epoch=$(git show -s --format=%ct HEAD)
          issued=$(node -e 'process.stdout.write(new Date(Number(process.argv[1])*1000).toISOString().replace(".000",""))' "$epoch")
          expires=$(node -e 'process.stdout.write(new Date((Number(process.argv[1])+90*86400)*1000).toISOString().replace(".000",""))' "$epoch")
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
          echo "issued=$issued" >> "$GITHUB_OUTPUT"
          echo "expires=$expires" >> "$GITHUB_OUTPUT"
      - name: Build and authenticate identical Registry bytes
        env:
          SOKSAK_REGISTRY_ED25519_SEED: ${{ secrets.SOKSAK_REGISTRY_ED25519_SEED }}
        run: |
          tool="$RUNNER_TEMP/spec/bin/validate.mjs"
          node "$tool" registry-build plugins --id official --sequence "${{ steps.identity.outputs.sequence }}" --issued-at "${{ steps.identity.outputs.issued }}" --expires-at "${{ steps.identity.outputs.expires }}" --out "$RUNNER_TEMP/unsigned.json"
          node "$tool" registry-authenticate "$RUNNER_TEMP/unsigned.json" --out "$RUNNER_TEMP/registry.json"
          test "$(jq -r .signature.keyId "$RUNNER_TEMP/registry.json")" = c20999a2363b111b542847cfe55ccf83
      - name: Create least-privilege publication token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.SOKSAK_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOKSAK_RELEASE_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: write
      - name: Publish the only Registry asset
        env:
          SOKSAK_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
        run: node "$RUNNER_TEMP/spec/bin/validate.mjs" registry-publish "$RUNNER_TEMP/registry.json" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
