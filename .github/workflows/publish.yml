name: publish-registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["plugins/**"]
concurrency:
  group: publish-registry
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: make verify REGISTRY=https://registry.npmjs.org/
      - name: Derive the deterministic Registry identity
        id: identity
        run: |
          sequence=
          maximum=10
          while read -r tag; do
            [[ "$tag" =~ ^registry-([0-9]+)$ ]] || continue
            number=${BASH_REMATCH[1]}
            test "$number" -gt "$maximum" && maximum=$number
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
            test "$sha" = "$GITHUB_SHA" && sequence=$number
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          test -n "$sequence" || sequence=$((maximum + 1))
          epoch=$(git show -s --format=%ct HEAD)
          issued=$(node -e 'process.stdout.write(new Date(Number(process.argv[1])*1000).toISOString().replace(".000",""))' "$epoch")
          expires=$(node -e 'process.stdout.write(new Date((Number(process.argv[1])+90*86400)*1000).toISOString().replace(".000",""))' "$epoch")
          echo "sequence=$sequence" >> "$GITHUB_OUTPUT"
          echo "issued=$issued" >> "$GITHUB_OUTPUT"
          echo "expires=$expires" >> "$GITHUB_OUTPUT"
      - name: Build and authenticate identical Registry bytes
        env:
          SOKSAK_REGISTRY_ED25519_SEED: ${{ secrets.SOKSAK_REGISTRY_ED25519_SEED }}
        run: |
          make build REGISTRY=https://registry.npmjs.org/ REGISTRY_SEQUENCE="${{ steps.identity.outputs.sequence }}" REGISTRY_ISSUED_AT="${{ steps.identity.outputs.issued }}" REGISTRY_EXPIRES_AT="${{ steps.identity.outputs.expires }}" REGISTRY_OUT="$RUNNER_TEMP/unsigned.json"
          make authenticate REGISTRY=https://registry.npmjs.org/ REGISTRY_IN="$RUNNER_TEMP/unsigned.json" REGISTRY_OUT="$RUNNER_TEMP/registry.json"
          test "$(jq -r .signature.keyId "$RUNNER_TEMP/registry.json")" = c20999a2363b111b542847cfe55ccf83
      - name: Create least-privilege publication token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.SOKSAK_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOKSAK_RELEASE_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: write
      - name: Publish the only Registry asset
        env:
          SOKSAK_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
        run: pnpm exec soksak-validate registry-publish "$RUNNER_TEMP/registry.json" --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA"
