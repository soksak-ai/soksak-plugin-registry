name: verify-plugin-entry
on:
  pull_request:
    paths: ["plugins/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require one plugin entry change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=AM "$BASE" "$HEAD")
          test "${#changed[@]}" = 1
          case "${changed[0]}" in plugins/*.json) ;; *) exit 1;; esac
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26.7.0"
      - name: Install the immutable Registry tool
        run: |
          mkdir -p "$RUNNER_TEMP/spec"
          curl -fsSL https://github.com/soksak-ai/soksak-spec/releases/download/v0.0.24/soksak-ai-plugin-spec-0.0.24.tgz -o "$RUNNER_TEMP/spec.tgz"
          echo "b68a8bbbcd4ba5696c8a9e847201ded8f5d609ce10287525735a3f83c20f9b3d  $RUNNER_TEMP/spec.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/spec.tgz" -C "$RUNNER_TEMP/spec" --strip-components=1
          test -z "$(find "$RUNNER_TEMP/spec" -type l -print -quit)"
      - run: node "$RUNNER_TEMP/spec/bin/validate.mjs" registry-verify plugins
